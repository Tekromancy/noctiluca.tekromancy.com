name: Deploy Noctiluca to noctiluca.tekromancy.com

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between in-progress and latest.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js static site
        run: npm run build

      - name: Ensure CNAME for Custom Subdomain
        run: |
          echo "noctiluca.tekromancy.com" > out/CNAME

      - name: Ensure .nojekyll in export output
        run: |
          touch out/.nojekyll

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctiluca-static-export
          path: out

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages Subdomain
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
